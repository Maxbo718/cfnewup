name: danmu-api auto update

on:
  schedule:
    # 每天 UTC 02:10 = 北京时间 10:10 检查一次
    - cron: '10 2 * * *'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 比较上游版本与线上版本
        id: check
        run: |
          set -e
          CURRENT=$(curl -s --max-time 15 https://dm.113210833.xyz/api/config | jq -r .version || echo "unknown")
          LATEST_RAW=$(curl -s --max-time 15 "https://img.shields.io/docker/v/logvar/danmu-api?sort=semver" | grep -o 'v[0-9.]*' | head -1 || echo "unknown")
          LATEST=${LATEST_RAW#v}
          echo "current=$CURRENT latest=$LATEST (raw=$LATEST_RAW)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 已是最新，跳过部署
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "线上版本 ${{ steps.check.outputs.current }} 已与上游 ${{ steps.check.outputs.latest }} 一致，无需部署"
          exit 0

      - name: 拉取上游最新代码
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --depth 1 https://github.com/huangxd-/danmu_api.git /tmp/danmu_api
          cd /tmp/danmu_api
          echo "upstream commit: $(git rev-parse --short HEAD)"

      - name: 安装 Node 依赖
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        if: steps.check.outputs.skip != 'true'
        working-directory: /tmp/danmu_api
        run: npm install --omit=dev

      - name: 部署到 Cloudflare Workers (danmu-api)
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 81c81da202b27c511ae3c60d0063e6d2
          workingDirectory: /tmp/danmu_api
          command: deploy

      - name: 验证部署结果
        if: steps.check.outputs.skip != 'true'
        run: |
          # 等待部署稳定 + 限流窗口(RATE_LIMIT_MAX_REQUESTS=3/分钟)重置；只发一次请求避免触发限流 403
          sleep 30
          OUT=$(curl -s -w $'\n%{http_code}' --max-time 25 https://dm.113210833.xyz/api/config)
          HTTP=$(echo "$OUT" | tail -n1)
          NEW=$(echo "$OUT" | head -n-1 | jq -r .version 2>/dev/null || echo "unknown")
          echo "部署后线上版本: $NEW（部署前 ${{ steps.check.outputs.current }}，上游 ${{ steps.check.outputs.latest }}）"
          echo "config 接口 HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::error::部署后服务不可用 (HTTP $HTTP)"
            exit 1
          fi