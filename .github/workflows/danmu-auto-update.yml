name: danmu-api auto update

on:
  schedule:
    # 每天 UTC 02:10 = 北京时间 10:10 检查一次
    - cron: '10 2 * * *'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 比较上游版本与线上版本（尽力而为）
        id: check
        run: |
          set -e
          # 线上版本（runner 出口 IP 可能被 API 限流，重试一次，仍失败视为 unknown → 走部署，幂等安全）
          CURRENT=$(curl -sA "Mozilla/5.0" --max-time 15 https://dm.113210833.xyz/api/config | jq -r .version 2>/dev/null || echo "unknown")
          if [ "$CURRENT" = "unknown" ]; then
            sleep 20
            CURRENT=$(curl -sA "Mozilla/5.0" --max-time 15 https://dm.113210833.xyz/api/config | jq -r .version 2>/dev/null || echo "unknown")
          fi
          # 上游 Docker 最新版本：shields.io 语义版本排序（自动排除 latest 标签），hub.docker.com 兜底
          LATEST_RAW=$(curl -s --max-time 15 "https://img.shields.io/docker/v/logvar/danmu-api?sort=semver" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$LATEST_RAW" ]; then
            LATEST_RAW=$(curl -s --max-time 15 "https://hub.docker.com/v2/repositories/logvar/danmu-api/tags?page_size=10" | jq -r '[.results[].name | select(. != "latest")][0]' 2>/dev/null)
          fi
          LATEST=${LATEST_RAW#v}
          echo "current=$CURRENT latest=$LATEST (raw=$LATEST_RAW)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          # 只有双方都能确认且相等才跳过；拿不到版本就部署一次（幂等）
          if [ "$CURRENT" = "$LATEST" ] && [ "$CURRENT" != "unknown" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 已是最新，跳过部署
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "线上版本 ${{ steps.check.outputs.current }} 已与上游 ${{ steps.check.outputs.latest }} 一致，无需部署"
          exit 0

      - name: 拉取上游最新代码
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --depth 1 https://github.com/huangxd-/danmu_api.git /tmp/danmu_api
          cd /tmp/danmu_api
          echo "upstream commit: $(git rev-parse --short HEAD)"

      - name: 安装 Node 依赖
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        if: steps.check.outputs.skip != 'true'
        working-directory: /tmp/danmu_api
        run: npm install --omit=dev

      - name: 部署到 Cloudflare Workers (danmu-api)
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 81c81da202b27c511ae3c60d0063e6d2
          workingDirectory: /tmp/danmu_api
          command: deploy

      - name: 验证部署结果（仅报告，不因限流误报失败）
        if: steps.check.outputs.skip != 'true'
        run: |
          sleep 30
          OUT=$(curl -sA "Mozilla/5.0" -w $'\n%{http_code}' --max-time 25 https://dm.113210833.xyz/api/config)
          HTTP=$(echo "$OUT" | tail -n1)
          NEW=$(echo "$OUT" | head -n-1 | jq -r .version 2>/dev/null || echo "unknown")
          echo "部署后线上版本: $NEW (HTTP $HTTP)"
          echo "（部署成败以 wrangler 步骤为准；此处仅报告，GitHub runner 出口可能被 API 限流干扰）"