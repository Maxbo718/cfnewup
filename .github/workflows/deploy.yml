name: Deploy to Cloudflare Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["从 cfnew 同步 Releases"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy _worker.js to Cloudflare (skip if identical)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SCRIPT_NAME: ${{ secrets.CF_SCRIPT_NAME || 'cfnew' }}
        run: python3 deploy_cf.py
